name: Update recent repos

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Rebuild the Recently Updated table
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]
          repos = []
          page = 1

          # Read all public repositories owned by this account, newest push first.
          while True:
              url = (
                  f"https://api.github.com/users/{owner}/repos"
                  f"?type=owner&sort=pushed&direction=desc&per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "profile-recent-repos-workflow",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      batch = json.load(response)
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API returned HTTP {exc.code}: {details}")
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          rows = []
          for repo in sorted(repos, key=lambda item: item.get("pushed_at") or "", reverse=True):
              if repo.get("fork") or repo.get("archived"):
                  continue
              if repo["name"].casefold() == owner.casefold():
                  continue
              description = (repo.get("description") or "No description yet")
              description = description.replace("|", r"\|").replace("\r", " ").replace("\n", " ")
              language = repo.get("language") or "—"
              pushed = (repo.get("pushed_at") or "")[:10] or "—"
              rows.append(
                  f"| [{repo['name']}]({repo['html_url']}) | {description} | {language} | {pushed} |"
              )
              if len(rows) == 5:
                  break

          table = (
              "| Repository | Description | Language | Last push |\n"
              "|---|---|---|---|\n"
              + ("\n".join(rows) if rows else "| No eligible repositories found | — | — | — |")
          )

          path = "README.md"
          with open(path, encoding="utf-8") as file:
              readme = file.read()

          pattern = r"<!-- RECENT:START -->.*?<!-- RECENT:END -->"
          replacement = f"<!-- RECENT:START -->\n{table}\n<!-- RECENT:END -->"
          updated, count = re.subn(pattern, lambda _: replacement, readme, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("Could not find RECENT:START and RECENT:END markers in README.md")

          with open(path, "w", encoding="utf-8", newline="\n") as file:
              file.write(updated)
          print(f"Updated Recently Updated with {len(rows)} repositories.")
          PY

      - name: Commit updated README when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "chore: update recent repos"
            git push
          fi
