name: Update recent repos

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the "Recently Updated" table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          user = os.environ["OWNER"]
          url = f"https://api.github.com/users/{user}/repos?sort=pushed&per_page=30&type=owner"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          repos = json.load(urllib.request.urlopen(req))

          rows = []
          for r in repos:
              # skip forks, archived repos, and the profile repo itself
              if r["fork"] or r["archived"] or r["name"].lower() == user.lower():
                  continue
              desc = (r["description"] or "No description yet").replace("|", "\\|")
              lang = r["language"] or "-"
              rows.append(f"| [{r['name']}]({r['html_url']}) | {desc} | {lang} | {r['pushed_at'][:10]} |")
              if len(rows) == 5:
                  break

          table = "| Repo | About | Lang | Last push |\n|---|---|---|---|\n" + "\n".join(rows)

          text = open("README.md", encoding="utf-8").read()
          new = re.sub(
              r"<!-- RECENT:START -->.*?<!-- RECENT:END -->",
              lambda m: f"<!-- RECENT:START -->\n{table}\n<!-- RECENT:END -->",
              text,
              flags=re.DOTALL,
          )
          open("README.md", "w", encoding="utf-8").write(new)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update recent repos"
            git push
          fi
